{% extends "core/base.html" %}
{% load static %}

{% block title %}Сравнение университетов{% endblock %}

{% block content %}

<section class="section">
    <div class="container">
        <h2 class="section__title">Сравнение университетов</h2>
        <p class="section__subtitle">Выбрано <span id="selectedCount">0</span> университетов</p>

        <div id="compareGrid" class="compare-grid"></div>

        <h3 class="section__title" style="margin-top:40px">AI рекомендация</h3>

        <button id="generateAI" class="btn btn--primary">Сгенерировать анализ</button>

        <div id="aiResult" class="ai-box" style="display:none;"></div>
    </div>
</section>

<script>
/* -----------------------------
   LOAD SELECTED UNIVERSITIES
------------------------------ */
const selected = JSON.parse(localStorage.getItem("compare_unis") || "[]");
document.getElementById("selectedCount").innerText = selected.length;

if (selected.length === 0) {
    document.getElementById("compareGrid").innerHTML =
        "<p>Вы не выбрали ни одного университета.</p>";
} else {
    fetch(`/api/compare/?ids=${selected.join(",")}`)
        .then(r => r.json())
        .then(data => renderCards(data.universities));
}

/* -----------------------------
   RENDER CARDS
------------------------------ */
function renderCards(list) {
    const grid = document.getElementById("compareGrid");
    grid.innerHTML = list.map(u => `
        <div class="compare-card">
            <img src="${u.image}" class="compare-img">
            <h3>${u.name}</h3>
            <p>📍 ${u.city}</p>
            <p>💰 ${u.price_min} – ${u.price_max} ₸ / год</p>
            <p>⭐ ${u.rating} / 5</p>
            <p>🧩 ${u.categories.join(" · ")}</p>
            <p>${u.grants ? "✅ Есть гранты" : "❌ Нет грантов"}</p>
        </div>
    `).join("");
}



/* -----------------------------
   🔥 AI ANALYSIS (OPENROUTER)
------------------------------ */

const OPENROUTER_API_KEY = "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";

const aiBtn = document.getElementById("generateAI");
const aiBox = document.getElementById("aiResult");

aiBtn.onclick = async () => {

    aiBox.style.display = "block";
    aiBox.innerHTML = "Генерация анализа...";

    if (selected.length === 0) {
        aiBox.innerHTML = "Выберите хотя бы один университет.";
        return;
    }

    const universities = await fetch(`/api/compare/?ids=${selected.join(",")}`)
        .then(r => r.json())
        .then(d => d.universities);

    const prompt = `
Сравни университеты по данным:
${JSON.stringify(universities, null, 2)}

Сделай:
- подробный анализ каждого университета
- плюсы и минусы
- сравнение стоимости
- оценку качества образования
- рекомендацию для студента-айтишника
- итог: какой лучше и почему.
`;

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                "Content-Type": "application/json",
                "HTTP-Referer": "http://localhost:8000",
                "X-Title": "HubUni Compare AI"
            },
            body: JSON.stringify({
                model: "openai/gpt-4o-mini",
                messages: [
                    { role: "system", content: "Ты эксперт по казахстанским университетам." },
                    { role: "user", content: prompt }
                ]
            })
        });

        const json = await response.json();

        if (!json.choices) {
            aiBox.innerHTML = "Ошибка API: " + JSON.stringify(json);
            return;
        }

        aiBox.innerHTML = json.choices[0].message.content.replace(/\n/g, "<br>");
    }
    catch (err) {
        aiBox.innerHTML = "Ошибка сети: " + err.message;
    }
};
</script>




<style>
.compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
    gap: 24px;
    margin-top: 20px;
}

.compare-card {
    background: #fff;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.07);
    font-size: 14px;
}

.compare-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 12px;
}

.ai-box {
    background: #fff;
    padding: 22px;
    border-radius: 16px;
    margin-top: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}
</style>

{% endblock %}
